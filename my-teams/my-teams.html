<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="View, load, edit, and manage your saved Pokémon teams."
    />

    <title>My Teams | Pocket Team Lab</title>

    <link rel="icon" href="/images/favicon.svg" />
    <link rel="stylesheet" href="/src/css/styles.css" />

    <link rel="stylesheet" href="/src/css/pages/my-teams.css" />

    <link rel="stylesheet" href="/src/css/responsive.css" />
  </head>

  <body>
    <div id="site-header"></div>

    <main class="page-container my-teams-page">
      <header class="my-teams-header">
        <div>
          <p class="my-teams-header__eyebrow">Team Collection</p>

          <h1>My Teams</h1>

          <p>View, load, edit, and manage your saved teams.</p>
        </div>

        <a class="button button--primary" data-route=""> + Create New Team </a>
      </header>

      <div class="my-teams-toolbar">
        <p>
          <strong id="saved-teams-total">0</strong>
          saved teams
        </p>

        <p
          id="saved-teams-message"
          class="saved-teams-message"
          aria-live="polite"
        ></p>
      </div>

      <section
        id="saved-teams-content"
        class="saved-teams-grid"
        aria-live="polite"
      ></section>
    </main>

    <div id="site-footer"></div>

    <script type="module" src="/src/js/pages/my-teams.js"></script>
  </body>
</html>
