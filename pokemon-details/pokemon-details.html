<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="View detailed information, abilities, statistics, and weaknesses for a Pokémon."
    />

    <title>Pokémon Details | Pocket Team Lab</title>

    <link rel="icon" href="/images/favicon.svg" />
    <link rel="stylesheet" href="/src/css/styles.css" />

    <link rel="stylesheet" href="/src/css/pages/pokemon-details.css" />

    <link rel="stylesheet" href="/src/css/responsive.css" />
  </head>

  <body>
    <div id="site-header"></div>

    <main class="page-container pokemon-details-page">
      <nav
        id="pokemon-navigation"
        class="pokemon-detail-navigation"
        aria-label="Pokémon navigation"
      ></nav>

      <section id="pokemon-details" aria-live="polite">
        <div class="pokemon-details-loading">
          <span class="pokemon-details-loading__ball" aria-hidden="true"></span>

          <p>Loading Pokémon information...</p>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script type="module" src="/src/js/pages/pokemon-details.js"></script>
  </body>
</html>
