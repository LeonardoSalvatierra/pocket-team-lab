<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="View and manage your favorite Pokémon and trading cards."
    />

    <title>Favorites | Pocket Team Lab</title>

    <link rel="icon" href="/images/favicon.svg" />
    <link rel="stylesheet" href="/src/css/styles.css" />

    <link rel="stylesheet" href="/src/css/pages/favorites.css" />

    <link rel="stylesheet" href="/src/css/responsive.css" />
  </head>

  <body>
    <div id="site-header"></div>

    <main class="page-container favorites-page">
      <header class="favorites-header">
        <div>
          <p class="favorites-header__eyebrow">Your Collection</p>

          <h1>Favorites</h1>

          <p>Keep your favorite Pokémon and cards together.</p>
        </div>

        <a class="button button--primary" data-route=""> Explore Pokémon </a>
      </header>

      <nav class="favorites-tabs" aria-label="Favorite categories">
        <button
          class="favorites-tab favorites-tab--active"
          type="button"
          data-favorites-tab="pokemon"
          aria-pressed="true"
        >
          Pokémon

          <span id="favorite-pokemon-count">0</span>
        </button>

        <button
          class="favorites-tab"
          type="button"
          data-favorites-tab="cards"
          aria-pressed="false"
        >
          Trading Cards

          <span id="favorite-card-count">0</span>
        </button>
      </nav>

      <section id="favorite-pokemon-section" class="favorites-section">
        <div class="favorites-toolbar">
          <label class="favorites-search">
            <span aria-hidden="true">⌕</span>

            <input
              id="favorite-search"
              type="search"
              placeholder="Search favorites..."
            />
          </label>

          <select id="favorite-sort" aria-label="Sort favorite Pokémon">
            <option value="number">Sort by number</option>

            <option value="name">Sort by name</option>
          </select>
        </div>

        <p
          id="favorites-message"
          class="favorites-message"
          aria-live="polite"
        ></p>

        <div
          id="favorite-pokemon-content"
          class="favorite-pokemon-grid"
          aria-live="polite"
        >
          <p class="loading-message">Loading favorites...</p>
        </div>
      </section>

      <section id="favorite-cards-section" class="favorites-section" hidden>
        <div class="favorites-empty">
          <span aria-hidden="true">◇</span>

          <h2>Trading card favorites</h2>

          <p>
            Favorite trading cards will appear here after the Trading Cards page
            is completed.
          </p>

          <a class="button button--secondary" data-route="cards/cards.html">
            Open Trading Cards
          </a>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script type="module" src="/src/js/pages/favorites.js"></script>
  </body>
</html>
